[project]
name = "apiguard"
version = "0.1.0"
description = "Multi-tenant FastAPI + PostgreSQL service with a single object-level authorization policy and an OWASP API Top 10 regression suite."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "0xrutabaga" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "email-validator>=2.1",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.9",
    "sqlalchemy>=2.0.30",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=1.11",
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apiguard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and literal test passwords by design.
"tests/**" = ["S101", "S105", "S106", "S107"]
"scripts/**" = ["S105", "S106", "S603"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
