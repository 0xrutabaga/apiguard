name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: apiguard
          POSTGRES_PASSWORD: apiguard
          POSTGRES_DB: apiguard
        ports:
          - 55431:5432
        options: >-
          --health-cmd "pg_isready -U apiguard -d apiguard"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      APIGUARD_TEST_DATABASE_URL: postgresql+psycopg://apiguard:apiguard@127.0.0.1:55431/apiguard_test
      APIGUARD_DATABASE_URL: postgresql+psycopg://apiguard:apiguard@127.0.0.1:55431/apiguard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Tests (unit, integration, security) against PostgreSQL 17
        run: uv run pytest -q
      - name: Demo
        run: uv run python scripts/demo.py
      - name: Dependency audit (locked requirements)
        run: |
          uv export --locked --format requirements-txt --no-emit-project -o requirements.audit.txt
          uvx pip-audit@2.10.1 --require-hashes --disable-pip -r requirements.audit.txt
